<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mental Health Companion</title>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #e8ecff, #f6f8ff);
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .chat-container {
            width: 420px;
            height: 640px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #7b78ff;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-weight: 600;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-box {
            padding: 18px;
            flex: 1;
            overflow-y: auto;
            background: #f7f8fc;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 16px;
            animation: fadeIn 0.4s ease-in-out;
            line-height: 1.4;
            font-size: 14.5px;
        }

        .bot {
            background: #eef1ff;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .user {
            background: #7b78ff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .typing {
            font-style: italic;
            opacity: 0.7;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        textarea {
            width: 100%;
            min-height: 44px;
            max-height: 120px;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1.5px solid #e5e7eb;
            font-size: 14.5px;
            font-family: inherit;
            resize: none;
            outline: none;
            box-sizing: border-box;
            line-height: 1.4;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            border-color: #7b7afc;
            box-shadow: 0 0 0 2px rgba(123, 122, 252, 0.15);
        }

        button {
            margin-top: 10px;
            width: 100%;
            background: #7b78ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #6a67f5;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            padding: 8px;
            color: #777;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="header">
        <h2>Mental Health Companion</h2>
        <p>A calm, safe space to share your thoughts</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="bubble bot">
            Hi 👋<br>
            I’m here to listen.<br>
            You can share anything that’s been on your mind.
        </div>

        {% if request.method == "POST" %}
            <div class="bubble user">{{ request.form.message }}</div>

            <div class="bubble bot typing" id="typing">
                Typing…
            </div>

            <div class="bubble bot" id="botReply" style="display:none;">
                {{ response }}
            </div>
        {% endif %}
    </div>

    <div class="input-area">
        <form method="POST" id="chatForm">
            <textarea id="message" name="message" placeholder="Type your thoughts here..."></textarea>
            <button type="submit">Send</button>
        </form>
    </div>

    <div class="footer">
        ⚠️ Support only — not a replacement for professional care
    </div>
</div>

<script>
    // Typing animation
    const typing = document.getElementById("typing");
    const reply = document.getElementById("botReply");

    if (typing && reply) {
        setTimeout(() => {
            typing.style.display = "none";
            reply.style.display = "block";
            scrollBottom();
        }, 1200);
    }

    const form = document.getElementById("chatForm");
    const textarea = document.getElementById("message");
    const chatBox = document.getElementById("chatBox");

    textarea.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            form.submit();
        }
    });

    function scrollBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    scrollBottom();
</script>

</body>
</html>
